<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64">
  <defs>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="62" rx="10" fill="#0D1117"/>
  <rect x="1" y="1" width="898" height="62" rx="10" fill="none" stroke="#58A6FF" stroke-width="1" opacity="0.35"/>
  <rect x="1" y="1" width="898" height="1.5" fill="#58A6FF" opacity="0.6" filter="url(#glow)"/>

  <circle cx="30" cy="32" r="5" fill="#39D353">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="37" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#C9D1D9">Available for new Flutter / Firebase engagements</text>

  <text x="860" y="37" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#58A6FF">asimsafeer/asimsafeer</text>
  <rect x="866" y="26" width="8" height="13" fill="#58A6FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
